<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOARD_02_MANIFEST</title>
    <style>
        @import url('https://cdnfonts.com');

        body {
            background-color: black;
            color: #ffffff;
            font-family: '8bit Operator JVE', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            letter-spacing: 2px;
            cursor: pointer; /* Shows the user they can click to advance */
        }
        .text-container {
            max-width: 700px;
            font-size: 24px;
            line-height: 1.8;
            text-transform: uppercase;
            min-height: 100px; /* Prevents layout shifting between lines */
        }
        .prompt-text {
            color: #666;
            font-size: 14px;
            margin-top: 40px;
            text-transform: uppercase;
        }
        #jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #jumpscare-overlay img {
            max-width: 90%;
            max-height: 90%;
            filter: contrast(180%) brightness(90%); 
        }
    </style>
</head>
<body>

    <!-- The container where dialogue lines will cycle -->
    <div class="text-container" id="dialogue-box"></div>
    
    <!-- Small indicator at the bottom to guide players -->
    <div class="prompt-text" id="prompt-box">[ PRESS Z OR CLICK TO ADVANCE ]</div>

    <div id="jumpscare-overlay">
        <img src="./image_friend.jpg" alt="FRIEND">
    </div>

    <script>
        // Array of lines to display sequentially
        const dialogueLines = [
            "So you do think this will get you something.",
            "Anything at all.",
            "What do you want from me?",
            "An ARG?",
            "I don't have the budget for that!",
            "So, take this instead."
        ];

        let currentLineIndex = 0;
        const dialogueBox = document.getElementById('dialogue-box');

        // Function to update the text on screen
        function displayCurrentLine() {
            if (currentLineIndex < dialogueLines.length) {
                dialogueBox.innerHTML = `<p>${dialogueLines[currentLineIndex]}</p>`;
            } else {
                // If out of lines, trigger the jumpscare payoff
                triggerJumpscare();
            }
        }

        function advanceDialogue() {
            currentLineIndex++;
            displayCurrentLine();
        }

        function triggerJumpscare() {
            // Hide all dialogue components
            dialogueBox.style.display = 'none';
            document.getElementById('prompt-box').style.display = 'none';
            
            // Show IMAGE_FRIEND.jpg overlay
            document.getElementById('jumpscare-overlay').style.display = 'flex';
            
            // Force final redirect after 1.5 seconds of exposure
            setTimeout(function() {
                window.location.href = "https://deltarune.com";
            }, 1500); 
        }

        // Listen for keyboard inputs (specifically the 'Z' key)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'z' || event.key === 'Z') {
                advanceDialogue();
            }
        });

        // Mobile backup: Listen for screen clicks/taps so phone users aren't locked out
        document.addEventListener('click', function() {
            advanceDialogue();
        });

        // Initialize the very first line when page loads
        displayCurrentLine();
    </script>

</body>
</html>
